<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contextual Risk Analysis Dashboard</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      margin: 0;
      padding: 16px 24px;
      font-size: 14px;
      line-height: 1.5
    }

    /* ── Header ────────────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1e3a5f, #0f172a);
      color: white;
      padding: 24px 28px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2)
    }

    .header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.3px
    }

    .header-project {
      font-size: 13px;
      opacity: .65;
      margin-top: 4px
    }

    .header-meta {
      display: flex;
      gap: 20px;
      margin-top: 12px;
      font-size: 12px;
      opacity: .6;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255, 255, 255, .1);
      padding-top: 12px
    }

    /* ── Summary cards ─────────────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .07);
      border-top: 3px solid transparent
    }

    .card .val {
      font-size: 28px;
      font-weight: 700;
      line-height: 1
    }

    .card .lbl {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #64748b;
      margin-top: 4px
    }

    .card.red {
      border-top-color: #ef4444
    }

    .card.red .val {
      color: #dc2626
    }

    .card.amber {
      border-top-color: #f59e0b
    }

    .card.amber .val {
      color: #d97706
    }

    .card.green {
      border-top-color: #10b981
    }

    .card.green .val {
      color: #059669
    }

    .card.blue {
      border-top-color: #3b82f6
    }

    .card.blue .val {
      color: #2563eb
    }

    .card.grey {
      border-top-color: #94a3b8
    }

    .card.grey .val {
      color: #475569
    }

    /* ── Alert ─────────────────────────────────────────────────── */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 500
    }

    .alert.err {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b
    }

    /* ── Section ───────────────────────────────────────────────── */
    .section {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
      margin-bottom: 16px;
      overflow: hidden
    }

    .sec-hdr {
      padding: 14px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sec-hdr h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600
    }

    .sec-hdr .cnt {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #e2e8f0;
      color: #475569;
      font-weight: 500
    }

    .sec-body {
      padding: 16px 20px
    }

    /* ── Action items ──────────────────────────────────────────── */
    .action {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden
    }

    .action:last-child {
      margin-bottom: 0
    }

    .action-hdr {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none
    }

    .action-hdr:hover {
      background: #f8fafc
    }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 2px
    }

    .step-num.r {
      background: #fee2e2;
      color: #b91c1c
    }

    .step-num.a {
      background: #fef3c7;
      color: #b45309
    }

    .step-num.g {
      background: #f0fdf4;
      color: #166534
    }

    .action-main {
      flex: 1;
      min-width: 0
    }

    .action-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    .action-sub {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap
    }

    .action-metrics {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .metric {
      font-size: 11px;
      color: #475569;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px
    }

    .action-body {
      padding: 0 16px 16px;
      border-top: 1px solid #f1f5f9;
      display: none
    }

    .action-body.open {
      display: block
    }

    .chev {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
      transition: transform .2s;
      flex-shrink: 0
    }

    .chev.open {
      transform: rotate(180deg)
    }

    /* ── Reachability dot ──────────────────────────────────────── */
    .rdot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      flex-shrink: 0;
      vertical-align: middle
    }

    .rdot.confirmed {
      background: #ef4444
    }

    .rdot.probable {
      background: #f97316
    }

    .rdot.unknown {
      background: #eab308
    }

    .rdot.unreachable {
      background: #22c55e
    }

    /* ── Badges ────────────────────────────────────────────────── */
    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block
    }

    .badge.MANDATORY {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5
    }

    .badge.RECOMMENDED {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d
    }

    .badge.MIGRATION_AVAILABLE {
      background: #f5f3ff;
      color: #5b21b6;
      border: 1px solid #c4b5fd
    }

    .badge.DEFER {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #6ee7b7
    }

    .compat {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600
    }

    .compat.BINARY_INCOMPATIBLE {
      background: #fef2f2;
      color: #b91c1c
    }

    .compat.SOURCE_INCOMPATIBLE {
      background: #fff7ed;
      color: #9a3412
    }

    .compat.COMPATIBLE {
      background: #f0fdf4;
      color: #166534
    }

    .compat.UNKNOWN {
      background: #f1f5f9;
      color: #475569
    }

    .sev {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600
    }

    .sev.CRITICAL {
      background: #fce7e7;
      color: #7f1d1d
    }

    .sev.HIGH {
      background: #fef3c7;
      color: #78350f
    }

    .sev.MEDIUM {
      background: #fff7ed;
      color: #9a3412
    }

    .sev.LOW {
      background: #ecfdf5;
      color: #064e3b
    }

    .sev.UNKNOWN {
      background: #f1f5f9;
      color: #475569
    }

    /* ── Notes ─────────────────────────────────────────────────── */
    .note {
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      margin-top: 10px
    }

    .note.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af
    }

    .note.warn {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b
    }

    .note.ok {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534
    }

    .note strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px
    }

    /* ── Code snippet ──────────────────────────────────────────── */
    .snippet {
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 10px;
      position: relative
    }

    .copy-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      background: #334155;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px
    }

    .copy-btn:hover {
      background: #3b82f6;
      color: white
    }

    .xt {
      color: #93c5fd
    }

    .xv {
      color: #86efac
    }

    /* ── CVE cards ─────────────────────────────────────────────── */
    .cve-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px
    }

    .cve-card:last-child {
      margin-bottom: 0
    }

    .cve-hdr {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px
    }

    .cve-id {
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      color: #2563eb;
      text-decoration: none
    }

    .cve-id:hover {
      text-decoration: underline
    }

    .cve-sum {
      font-size: 12px;
      color: #475569;
      margin: 4px 0 6px
    }

    .cve-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      color: #64748b
    }

    .alias {
      background: #dbeafe;
      color: #1e40af;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-family: monospace
    }

    .epss-bar {
      display: inline-flex;
      width: 50px;
      height: 5px;
      vertical-align: middle;
      border-radius: 3px;
      background: #e2e8f0;
      overflow: hidden;
      margin-left: 4px
    }

    /* ── Risk calculation ──────────────────────────────────────── */
    .rc {
      margin-top: 8px;
      border-top: 1px solid #e2e8f0;
      padding-top: 8px
    }

    .rc-summary {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      user-select: none
    }

    .rc-summary:hover {
      color: #2563eb
    }

    .rc-note {
      font-size: 11px;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 4px;
      padding: 6px 8px;
      margin: 8px 0 0
    }

    .rc-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 11px
    }

    .rc-table td {
      padding: 3px 6px;
      border-bottom: 1px solid #f1f5f9
    }

    .rc-label {
      color: #64748b;
      font-weight: 600;
      white-space: nowrap
    }

    .rc-op,
    .rc-val {
      font-family: ui-monospace, monospace;
      text-align: right;
      color: #475569;
      white-space: nowrap
    }

    .rc-subtotal td,
    .rc-total td {
      font-weight: 700;
      color: #1e293b;
      border-top: 1px solid #cbd5e1;
      border-bottom: none
    }

    .rc-total td {
      border-top: 2px solid #94a3b8
    }

    /* ── Reachable methods ─────────────────────────────────────── */
    .methods-list {
      list-style: none;
      padding: 0;
      margin: 4px 0 0
    }

    .methods-list li {
      font-size: 11px;
      font-family: monospace;
      color: #475569;
      padding: 3px 0;
      border-bottom: 1px solid #f1f5f9
    }

    .methods-list li:last-child {
      border-bottom: none
    }

    /* ── Breaking changes ──────────────────────────────────────── */
    .bc-search {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none
    }

    .bc-search:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 2px rgba(147, 197, 253, .3)
    }

    .bc-group {
      margin-bottom: 10px
    }

    .bc-group:last-child {
      margin-bottom: 0
    }

    .bc-group-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px
    }

    .bc-type-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      flex-shrink: 0
    }

    .bc-type-badge.BINARY {
      background: #fee2e2;
      color: #991b1b
    }

    .bc-type-badge.SOURCE {
      background: #fff7ed;
      color: #9a3412
    }

    .bc-group-cnt {
      font-size: 11px;
      color: #94a3b8;
      margin-left: auto;
      font-weight: 400
    }

    .bc-subgroup {
      margin: 4px 0 4px 12px
    }

    .bc-subgroup-hdr {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      padding: 3px 0;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 3px
    }

    .bc-item {
      font-size: 11px;
      font-family: monospace;
      color: #475569;
      padding: 3px 6px;
      border-radius: 3px;
      word-break: break-all;
      display: none
    }

    .bc-item.visible {
      display: block
    }

    .bc-item:hover {
      background: #f8fafc
    }

    .bc-empty {
      font-size: 12px;
      color: #94a3b8;
      font-style: italic;
      padding: 4px 0;
      display: none
    }

    .bc-empty.visible {
      display: block
    }

    /* ── Stability ─────────────────────────────────────────────── */
    .stability-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-top: 8px
    }

    .stability-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px
    }

    .stability-card-title {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0
    }

    .stability-row {
      margin-bottom: 8px
    }

    .stability-row:last-child {
      margin-bottom: 0
    }

    .stability-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .4px;
      display: block
    }

    .stability-value {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      display: block;
      margin-top: 1px
    }

    .stability-desc {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-top: 1px;
      line-height: 1.3
    }

    .score-bar {
      height: 5px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px
    }

    .score-fill {
      height: 100%;
      border-radius: 3px
    }

    .score-fill.low {
      background: #ef4444
    }

    .score-fill.mid {
      background: #f59e0b
    }

    .score-fill.high {
      background: #22c55e
    }

    /* ── Graph validation ──────────────────────────────────────── */
    .gv-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 12px
    }

    .gv-status.CLEAN {
      background: #f0fdf4;
      color: #166534
    }

    .gv-status.HAS_RISKS {
      background: #fefce8;
      color: #854d0e
    }

    .gv-status.UNAVAILABLE,
    .gv-status.NOT_RUN {
      background: #f1f5f9;
      color: #475569
    }

    /* ── Misc ──────────────────────────────────────────────────── */
    .deps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 6px
    }

    .dep-item {
      font-size: 12px;
      font-family: monospace;
      color: #475569;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0
    }

    .mono {
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 12px
    }

    h4.sub {
      margin: 14px 0 8px;
      font-size: 13px;
      color: #334155
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Contextual Risk Analysis Dashboard</h1>
    <div class="header-project" id="hdr-project"></div>
    <div class="header-meta" id="hdr-meta"></div>
  </div>

  <div id="mandatory-alert" class="alert err" style="display:none">
    &#9888; <span id="alert-text"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="section">
    <div class="sec-hdr">
      <h2>Remediation Action Plan</h2><span class="cnt" id="plan-cnt">0 actions</span>
    </div>
    <div class="sec-body" id="plan-body">
      <p style="color:#64748b;font-size:13px">No findings.</p>
    </div>
  </div>

  <div class="section">
    <div class="sec-hdr">
      <h2>Dependency Graph Validation</h2>
    </div>
    <div class="sec-body" id="gv-body"><span class="gv-status NOT_RUN">Not run</span></div>
  </div>

  <div class="section">
    <div class="sec-hdr">
      <h2>Scanned Dependencies</h2><span class="cnt" id="deps-cnt">0 deps</span>
    </div>
    <div class="sec-body">
      <div class="deps-grid" id="deps-grid"></div>
    </div>
  </div>

  <script id="report-data" type="application/json">REPORT_DATA_PLACEHOLDER</script>
  <script>
    const data = JSON.parse(document.getElementById('report-data').textContent);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const num = v => isFinite(+v) ? +v : 0;
    const fmt = (v, d = 2) => num(v).toFixed(d);
    const fmtDate = iso => { try { return new Date(iso).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' }) } catch { return iso || '' } };
    const epssClr = v => v >= 0.1 ? '#ef4444' : v >= 0.01 ? '#f59e0b' : '#10b981';

    // ─── Reachability ──────────────────────────────────────────────────────────
    const REACH_DOT = {
      REACHABLE_CONFIRMED: 'confirmed', REACHABLE_PROBABLE: 'probable',
      UNKNOWN: 'unknown', UNREACHABLE: 'unreachable'
    };
    const REACH_LABEL = {
      REACHABLE_CONFIRMED: 'Reachable — confirmed by call graph',
      REACHABLE_PROBABLE: 'Reachable — probable (library classes are in use)',
      UNKNOWN: 'Reachability unknown',
      UNREACHABLE: 'Not reachable from application code',
    };
    function reachDot(s) { return `<span class="rdot ${REACH_DOT[s] || 'unknown'}"></span>`; }
    function reachLabel(s) { return REACH_LABEL[s] || s.replace(/_/g, ' '); }

    // ─── CVE card ──────────────────────────────────────────────────────────────
    function buildCveCard(cve) {
      const id = esc(cve.id || 'N/A');
      const sev = esc(cve.severity || 'UNKNOWN');
      const score = cve.cvss?.score > 0 ? fmt(cve.cvss.score, 1) : null;
      const ev = cve.epss?.score;
      const ep = cve.epss?.percentile;
      const cwes = (cve.cwes || []).map(c => `<code>${esc(c)}</code>`).join(', ') || '—';
      const als = (cve.aliases || []).map(a => `<span class="alias">${esc(a)}</span>`).join(' ');
      const url = esc(`https://osv.dev/vulnerability/${id}`);
      const epssHtml = ev != null
        ? `<span>EPSS <b style="color:${epssClr(ev)}">${(ev * 100).toFixed(3)}%</b>
       ${ep != null ? `<span style="color:#94a3b8">(P${Math.round(ep * 100)})</span>` : ''}
       <span class="epss-bar"><span style="width:${Math.min(ev * 100, 100)}%;background:${epssClr(ev)};height:100%;display:block;border-radius:3px"></span></span></span>`
        : '<span style="color:#94a3b8">EPSS: N/A</span>';
      return `<div class="cve-card">
    <div class="cve-hdr">
      <div>
        <a class="cve-id" href="${url}" target="_blank" rel="noopener">${id}</a>
        ${als ? `<div style="margin-top:4px">${als}</div>` : ''}
      </div>
      <span class="sev ${sev}">${sev}</span>
    </div>
    ${cve.summary ? `<p class="cve-sum">${esc(cve.summary)}</p>` : ''}
    <div class="cve-meta">
      ${score ? `<span>CVSS <b>${score}</b></span>` : '<span style="color:#94a3b8">CVSS: N/A</span>'}
      ${epssHtml}
      <span>CWEs: ${cwes}</span>
      ${fmtDate(cve.published) ? `<span>Published: ${fmtDate(cve.published)}</span>` : ''}
      ${fmtDate(cve.modified) ? `<span>Updated: ${fmtDate(cve.modified)}</span>` : ''}
    </div>
    ${cve.advisoryUrl ? `<div style="margin-top:6px;font-size:11px">
      <a style="color:#2563eb" href="${esc(cve.advisoryUrl)}" target="_blank" rel="noopener">Advisory &#8599;</a>
      ${cve.fixCommitUrl ? `&nbsp;&nbsp;<a style="color:#2563eb" href="${esc(cve.fixCommitUrl)}" target="_blank" rel="noopener">Fix commit &#8599;</a>` : ''}
    </div>`: ''}
    ${renderRiskCalculation(cve.contextualRisk)}
  </div>`;
    }

    // ─── Risk calculation ──────────────────────────────────────────────────────
    // Every number here is read from the report. The framework owns the formula;
    // this panel only lays out the factors it published.
    function renderRiskCalculation(risk) {
      if (!risk) return '';

      const epssAvailable = risk.epss != null;

      const row = (label, value, weight) => `<tr>
      <td class="rc-label">${label}</td>
      <td class="rc-val">${value}</td>
      <td class="rc-op">&times; ${fmt(weight, 3)}</td>
    </tr>`;

      // EPSS absent is not EPSS zero: its weight is redistributed over the
      // remaining signals, so the weights shown here are the ones applied.
      const renormalisedNote = epssAvailable
        ? ''
        : `<p class="rc-note">No EPSS score is published for this vulnerability.
         Its weight was redistributed over CVSS and staleness, so the effective
         weights below differ from the configured ones.</p>`;

      return `<details class="rc">
    <summary class="rc-summary">Risk calculation &mdash; how ${fmt(risk.value)} was derived</summary>
    ${renormalisedNote}
    <table class="rc-table">
      <tbody>
        ${row('CVSS', fmt(risk.cvssNormalized, 3) + ' normalised', risk.effectiveCvssWeight)}
        ${row('EPSS', epssAvailable ? fmt(risk.epss, 3) : 'unavailable', risk.effectiveEpssWeight)}
        ${row('Staleness', fmt(risk.stalenessUrgency, 3) + ' urgency', risk.effectiveStalenessWeight)}
        <tr class="rc-subtotal">
          <td colspan="2">Base risk</td>
          <td class="rc-val">${fmt(risk.baseRisk, 3)}</td>
        </tr>
        ${row('Reachability', esc(reachLabel(risk.reachabilityStatus)), risk.reachabilityFactor)}
        ${row('Upgrade path quality', 'security signal', risk.pathQualityFactor)}
        <tr class="rc-total">
          <td colspan="2">Contextual risk</td>
          <td class="rc-val">${fmt(risk.value, 3)}</td>
        </tr>
      </tbody>
    </table>
  </details>`;
    }

    // ─── Maven snippet ─────────────────────────────────────────────────────────
    function mavenSnippet(artifact, fixVer) {
      const pts = artifact.split(':');
      const g = esc(pts[0] || ''), a = esc(pts[1] || ''), v = esc(fixVer || '');
      const sid = 'snip-' + artifact.replace(/[^a-z0-9]/gi, '-');
      return `<div style="margin-top:12px">
    <strong style="font-size:12px;color:#475569">pom.xml update:</strong>
    <div class="snippet">
      <button class="copy-btn" onclick="copySnip('${sid}')">Copy</button>
      <div id="${sid}"><span class="xt">&lt;dependency&gt;</span>
    <span class="xt">&lt;groupId&gt;</span><span class="xv">${g}</span><span class="xt">&lt;/groupId&gt;</span>
    <span class="xt">&lt;artifactId&gt;</span><span class="xv">${a}</span><span class="xt">&lt;/artifactId&gt;</span>
    <span class="xt">&lt;version&gt;</span><span class="xv">${v}</span><span class="xt">&lt;/version&gt;</span>
<span class="xt">&lt;/dependency&gt;</span></div>
    </div>
  </div>`;
    }
    function copySnip(id) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.innerText).then(() => {
        const btn = el.parentElement.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 2000); }
      });
    }

    // ─── Stability ─────────────────────────────────────────────────────────────
    function parseStability(s) {
      if (!s) return null;
      // Reports written under a locale that uses the comma as the decimal
      // separator must still parse: "0,85" captured as "0" would render a
      // measured value as zero.
      const get = re => { const m = s.match(re); return m ? m[1].replace(',', '.') : null; };
      return {
        tood: get(/TOOD=(\d+)/),
        versionLag: get(/VersionLag=(\d+)/),
        latestVersion: get(/LatestVersion=([\w.\-]+)/),
        stabilityScore: get(/StabilityScore=([\d.,]+)/),
        adoptionRate: get(/AdoptionRate=([\d.,]+%)/),
        lifespan: get(/Lifespan=(\d+)/),
        maintenanceRate: get(/MaintenanceRate=([\d.,]+)/),
        upgradePath: get(/Upgrade path:\s*([A-Z_]+)/),
        upgradePathSecuritySignal: get(/upgradePathSecuritySignal:\s*([\d.,]+)/),
      };
    }
    function renderStability(summary, fixVersion, currentVersion) {
      const s = parseStability(summary);
      if (!s) return '';

      const toodDays = parseInt(s.tood || '0');
      const toodExtra = toodDays > 365 ? ` (~${(toodDays / 365).toFixed(1)} years)` : '';
      const lag = parseInt(s.versionLag || '0');
      // Unavailable ecosystem data must not be rendered as zero confidence.
      const scoreAvailable = s.stabilityScore != null;
      const scorePct = scoreAvailable ? Math.round(parseFloat(s.stabilityScore) * 100) : 0;
      const scoreCls = scorePct < 20 ? 'low' : scorePct < 60 ? 'mid' : 'high';
      // A measured zero is a real signal; only an absent measurement is "No data".
      const maintYr = s.maintenanceRate != null
        ? (parseFloat(s.maintenanceRate) * 365).toFixed(1) + ' releases/year'
        : 'No data';
      const adoption = s.adoptionRate != null ? s.adoptionRate : 'No data';
      const lifespan = s.lifespan != null ? `${s.lifespan} days` : 'No data';
      // An unvalidated path is a third state, not a risky one.
      const upgPath = s.upgradePath === 'CLEAN'
        ? { colour: '#166534', label: 'None' }
        : s.upgradePath === 'HAS_RISKS'
          ? { colour: '#b91c1c', label: 'Yes &mdash; review required' }
          : { colour: '#64748b', label: 'Not validated &mdash; ecosystem data unavailable' };

      return `<div style="margin-top:14px">
    <h4 class="sub">Ecosystem Analysis</h4>
    <div class="stability-grid">
      <div class="stability-card">
        <div class="stability-card-title">Current version${currentVersion ? ' (' + esc(currentVersion) + ')' : ''}</div>
        <div class="stability-row">
          <span class="stability-label">Time out of date</span>
          <span class="stability-value">${toodDays.toLocaleString()} days${toodExtra}</span>
          <span class="stability-desc">Days since a newer version was published</span>
        </div>
        <div class="stability-row">
          <span class="stability-label">Versions behind</span>
          <span class="stability-value">${lag} release${lag !== 1 ? 's' : ''}</span>
          <span class="stability-desc">Number of releases skipped since this version</span>
        </div>
        <div class="stability-row">
          <span class="stability-label">Latest available</span>
          <span class="stability-value mono">${esc(s.latestVersion || 'unknown')}</span>
          <span class="stability-desc">Most recent version published in the ecosystem</span>
        </div>
      </div>
      <div class="stability-card">
        <div class="stability-card-title">Fix version${fixVersion ? ' (' + esc(fixVersion) + ')' : ''} - Ecosystem Health</div>
        <div class="stability-row">
          <span class="stability-label">Stability score</span>
          <span class="stability-value">${scoreAvailable ? scorePct + '/100' : 'No data'}</span>
          ${scoreAvailable
          ? `<div class="score-bar"><div class="score-fill ${scoreCls}" style="width:${scorePct}%"></div></div>`
          : ''}
          <span class="stability-desc">${scoreAvailable
          ? 'Composite of adoption rate, active lifespan, and release frequency'
          : 'Ecosystem data unavailable for this version &mdash; not the same as low confidence'}</span>
        </div>
        <div class="stability-row">
          <span class="stability-label">Adoption rate</span>
          <span class="stability-value">${esc(adoption)}</span>
          <span class="stability-desc">Fraction of dependent projects currently using this version</span>
        </div>
        <div class="stability-row">
          <span class="stability-label">Active lifespan</span>
          <span class="stability-value">${esc(lifespan)}</span>
          <span class="stability-desc">How long this version was actively used before the ecosystem moved on</span>
        </div>
        <div class="stability-row">
          <span class="stability-label">Release frequency</span>
          <span class="stability-value">${esc(maintYr)}</span>
          <span class="stability-desc">How actively new versions are published by maintainers</span>
        </div>
      </div>
      <div class="stability-card">
        <div class="stability-card-title">Upgrade path assessment</div>
        <div class="stability-row">
          <span class="stability-label">New vulnerabilities introduced</span>
          <span class="stability-value" style="color:${upgPath.colour}">${upgPath.label}</span>
          <span class="stability-desc">Whether the fix version itself carries known CVEs</span>
        </div>
        <div class="stability-row">
          <span class="stability-label">Upgrade path security signal</span>
          <span class="stability-value">${s.upgradePathSecuritySignal != null ? s.upgradePathSecuritySignal : 'N/A'}</span>
          <span class="stability-desc">Change in aggregate vulnerability risk score after upgrade</span>
        </div>
      </div>
    </div>
  </div>`;
    }

    // ─── Breaking changes ──────────────────────────────────────────────────────
    function groupBreakingChanges(changes) {
      const groups = {};
      for (const c of changes) {
        const tm = c.match(/^\[(BINARY|SOURCE)\]/);
        if (!tm) continue;
        const type = tm[1];
        let sub = 'Classes';
        if (c.match(/\]\s+Method\s+/)) sub = 'Methods';
        else if (c.match(/\]\s+Constructor\s+/)) sub = 'Constructors';
        else if (c.match(/\]\s+[Ff]ield\s+/)) sub = 'Fields';
        if (!groups[type]) groups[type] = {};
        if (!groups[type][sub]) groups[type][sub] = [];
        groups[type][sub].push(c);
      }
      return groups;
    }
    function renderBreakingChanges(changes, totalCount, idx) {
      if (!changes || !changes.length) return '';
      const groups = groupBreakingChanges(changes);
      const fid = `bcf-${idx}`;
      const cid = `bcc-${idx}`;
      const countNote = changes.length < totalCount
        ? ` <span style="color:#94a3b8;font-weight:400">(showing ${changes.length} of ${totalCount})</span>`
        : '';
      const typeLabels = { BINARY: 'Binary incompatible', SOURCE: 'Source incompatible' };

      let inner = '';
      for (const [type, subgroups] of Object.entries(groups)) {
        const typeTotal = Object.values(subgroups).reduce((s, a) => s + a.length, 0);
        const subSummary = Object.entries(subgroups).map(([k, v]) => `${v.length} ${k.toLowerCase()}`).join(', ');
        inner += `<div class="bc-group">
      <div class="bc-group-hdr">
        <span class="bc-type-badge ${type}">${type}</span>
        <span>${typeLabels[type] || type}</span>
        <span class="bc-group-cnt">${typeTotal} (${subSummary})</span>
      </div>`;
        for (const [subtype, items] of Object.entries(subgroups)) {
          inner += `<div class="bc-subgroup">
        <div class="bc-subgroup-hdr">${subtype} (${items.length})</div>`;
          for (const item of items) {
            const rest = item.replace(/^\[(BINARY|SOURCE)\]\s+(Method|Constructor|Field|Class)\s+/, '').trim();
            inner += `<div class="bc-item visible" data-text="${esc(item.toLowerCase())}">${esc(rest)}</div>`;
          }
          inner += `</div>`;
        }
        inner += `</div>`;
      }

      return `<div style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <h4 class="sub" style="margin:0;color:#991b1b">Breaking API Changes (${totalCount})${countNote}</h4>
    </div>
    <input class="bc-search" id="${fid}" type="text" placeholder="Filter changes..."
           oninput="filterBC(this.value,'${cid}','${fid}')">
    <div id="${cid}">${inner}</div>
    <div class="bc-empty" id="${fid}-empty">No changes match the filter.</div>
  </div>`;
    }
    function filterBC(value, containerId, filterId) {
      const container = document.getElementById(containerId);
      const emptyEl = document.getElementById(filterId + '-empty');
      if (!container) return;
      const q = value.toLowerCase().trim();
      let anyVisible = false;
      container.querySelectorAll('.bc-item').forEach(el => {
        const match = !q || (el.dataset.text || '').includes(q);
        el.classList.toggle('visible', match);
        if (match) anyVisible = true;
      });
      container.querySelectorAll('.bc-subgroup').forEach(sg => {
        sg.style.display = sg.querySelectorAll('.bc-item.visible').length > 0 ? '' : 'none';
      });
      container.querySelectorAll('.bc-group').forEach(g => {
        g.style.display = g.querySelectorAll('.bc-item.visible').length > 0 ? '' : 'none';
      });
      if (emptyEl) emptyEl.classList.toggle('visible', !anyVisible && !!q);
    }

    // ─── Main setup ────────────────────────────────────────────────────────────
    const findings = Array.isArray(data.findings) ? data.findings : [];
    const gv = data.globalGraphValidation;

    document.getElementById('hdr-project').textContent = 'Project: ' + (data.projectName || 'N/A');
    document.getElementById('hdr-meta').innerHTML = [
      (data.totalDependenciesScanned ?? 0) + ' dependencies scanned',
      findings.length + ' finding' + (findings.length !== 1 ? 's' : ''),
      'Generated ' + new Date().toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }),
    ].map(s => `<span>${esc(s)}</span>`).join('');

    let mandatory = 0, recommended = 0, totalCves = 0, reachable = 0;
    findings.forEach(f => {
      const d = f.remediation?.decision || 'DEFER';
      if (d === 'MANDATORY') mandatory++;
      else if (d === 'RECOMMENDED') recommended++;
      totalCves += (f.vulnerabilities || []).length;
      if ((f.reachability?.status || '').startsWith('REACHABLE')) reachable++;
    });

    if (mandatory > 0) {
      document.getElementById('mandatory-alert').style.display = 'block';
      document.getElementById('alert-text').textContent =
        mandatory + ' artifact' + (mandatory > 1 ? 's' : '') +
        ' require immediate upgrade — reachable vulnerabilities with an available fix.';
    }

    const gvSt = gv?.status || 'NOT_RUN';
    const gvCard = gvSt === 'CLEAN' ? { c: 'green', v: '&#10003;', l: 'Graph Clean' }
      : gvSt === 'HAS_RISKS' ? { c: 'amber', v: '!', l: 'Graph Risks' }
        : { c: 'grey', v: '&mdash;', l: 'Graph N/A' };
    document.getElementById('cards').innerHTML = [
      { c: 'blue', v: data.totalDependenciesScanned ?? 0, l: 'Dependencies' },
      { c: 'red', v: totalCves, l: 'Total CVEs' },
      { c: 'amber', v: reachable, l: 'Reachable' },
      { c: 'red', v: mandatory, l: 'Mandatory' },
      { c: 'amber', v: recommended, l: 'Recommended' },
      { c: gvCard.c, v: gvCard.v, l: gvCard.l },
    ].map(c => `<div class="card ${c.c}"><div class="val">${c.v}</div><div class="lbl">${c.l}</div></div>`).join('');

    // ─── Action plan ──────────────────────────────────────────────────────────
    const ORDER = { MANDATORY: 0, RECOMMENDED: 1, MIGRATION_AVAILABLE: 2, DEFER: 3 };
    // Within a decision group, order by the risk of leaving the artifact as it is.
    // remediation.riskReduction is what the plan removes, and is zero whenever no
    // automatic upgrade exists — sorting on it would bury confirmed-reachable
    // vulnerabilities that simply have no one-line fix.
    const sorted = [...findings].sort((a, b) => {
      const da = a.remediation?.decision || 'DEFER', db = b.remediation?.decision || 'DEFER';
      return (ORDER[da] ?? 3) - (ORDER[db] ?? 3)
        || num(b.contextualRisk) - num(a.contextualRisk);
    });

    document.getElementById('plan-cnt').textContent = sorted.length + ' action' + (sorted.length !== 1 ? 's' : '');

    if (sorted.length === 0) {
      document.getElementById('plan-body').innerHTML =
        '<p style="color:#64748b;font-size:13px;text-align:center;padding:20px 0">&#10003; No upgrade actions needed.</p>';
    } else {
      document.getElementById('plan-body').innerHTML = sorted.map((f, i) => {
        const d = f.remediation?.decision || 'DEFER';
        const fv = f.remediation?.recommendedVersion || '';
        const rs = f.reachability?.status || 'UNKNOWN';
        const cs = f.compatibility?.status || 'UNKNOWN';
        const bc = f.compatibility?.breakingChangeCount || 0;
        const adj = f.compatibility?.contextuallyAdjusted || false;
        const vl = f.vulnerabilities || [];
        const rm = f.reachability?.reachableMethods || [];
        const sid = 'ab-' + i, cid = 'ch-' + i;
        const stepCls = d === 'MANDATORY' ? 'r'
          : (d === 'RECOMMENDED' || d === 'MIGRATION_AVAILABLE') ? 'a'
            : 'g';
        const sevs = [...new Set(vl.map(v => v.severity).filter(Boolean))]
          .map(s => `<span class="sev ${s}">${s}</span>`).join(' ');

        // Current version from artifact string (groupId:artifactId:version)
        const artParts = (f.artifact || '').split(':');
        const currentVersion = artParts[2] || '';

        // Compatibility note
        let compatNote = '';
        if (cs === 'BINARY_INCOMPATIBLE') {
          compatNote = `<div class="note warn"><strong>&#9888; Binary incompatible &mdash; ${bc} breaking change${bc !== 1 ? 's' : ''}</strong>Verify your code does not call any removed or changed APIs before upgrading.</div>`;
        } else if (cs === 'SOURCE_INCOMPATIBLE') {
          compatNote = `<div class="note warn"><strong>&#9888; Source incompatible &mdash; ${bc} breaking change${bc !== 1 ? 's' : ''}</strong>Some API signatures changed. Recompile and test thoroughly after upgrading.</div>`;
        } else if (adj && bc > 0) {
          compatNote = `<div class="note ok"><strong>&#10003; Upgrade is safe &mdash; breaking changes are not reachable</strong>Binary compatibility analysis found ${bc} breaking change${bc !== 1 ? 's' : ''}, but static call graph analysis confirmed that none of the affected methods are invoked from your application code. Upgrade risk is low.</div>`;
        }

        // Reachability note
        // Reachability reports call-graph evidence only. Priority follows from the
        // contextual risk and the optimiser's decision, which weigh severity,
        // exploitability and whether a fix exists at all — none of which this
        // panel can see. Telling the reader to "upgrade immediately" here
        // contradicts the DEFER badge on an artifact that has no fix.
        let reachNote = '';
        if (rs === 'UNREACHABLE') {
          reachNote = `<div class="note info"><strong>Vulnerable code is not reachable from your application</strong>Static call graph analysis found no execution path from your code to the vulnerable library classes.</div>`;
        } else if (rs === 'REACHABLE_CONFIRMED') {
          reachNote = `<div class="note warn"><strong>&#9888; Vulnerable class is directly invoked</strong>The call graph confirms your application reaches the specific vulnerable class, so the vulnerable code is exercised.</div>`;
        } else if (rs === 'REACHABLE_PROBABLE') {
          reachNote = `<div class="note warn"><strong>&#9888; Classes from the vulnerable library are in use</strong>Your application calls classes from this library. The CVE description does not identify the specific vulnerable class, so exploitability could neither be confirmed nor excluded.</div>`;
        }

        const cveHtml = vl.map(buildCveCard).join('');
        const bcHtml = renderBreakingChanges(f.compatibility?.topBreakingChanges || [], bc, i);
        const stabHtml = renderStability(f.stabilitySummary || '', fv, currentVersion);
        const rmHtml = rm.length > 0
          ? `<div style="margin-top:10px">
           <div style="font-size:12px;font-weight:600;color:#334155;margin-bottom:4px">
             Reachable methods from this library (${rm.length})
           </div>
           <ul class="methods-list">${rm.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
         </div>`
          : '';
        const rationaleHtml = f.remediation?.rationale
          ? `<div class="note info" style="margin-top:10px"><strong>Prioritization rationale</strong>${esc(f.remediation.rationale)}</div>`
          : '';

        return `<div class="action">
      <div class="action-hdr" onclick="toggle('${sid}','${cid}')">
        <div class="step-num ${stepCls}">${i + 1}</div>
        <div class="action-main">
          <div class="action-title">
            <span class="mono">${esc(f.artifact || '')}</span>
            ${fv ? `<span style="color:#059669;font-weight:600">&#8594; ${esc(fv)}</span>` : ''}
            <span class="badge ${d}">${d}</span>
            ${cs !== 'UNKNOWN' ? `<span class="compat ${cs}">${cs.replace(/_/g, ' ')}${adj ? ' (contextual)' : ''}</span>` : ''}
          </div>
          <div class="action-sub">
            ${reachDot(rs)}<span>${reachLabel(rs)}</span>
            <span style="color:#cbd5e1">&bull;</span>
            <span>${vl.length} CVE${vl.length !== 1 ? 's' : ''}</span>
            <span style="color:#cbd5e1">&bull;</span>
            ${sevs}
          </div>
          <div class="action-metrics">
            <span class="metric">Contextual risk: <b>${fmt(f.contextualRisk)}</b></span>
            <span class="metric">Risk reduction: <b>${fmt(f.remediation?.riskReduction)}</b></span>
            <span class="metric">Effort: <b>${fmt(f.remediation?.effortCost, 1)} units</b></span>
            ${bc > 0 ? `<span class="metric" style="color:${adj ? '#b45309' : '#b91c1c'}">${bc} breaking change${bc !== 1 ? 's' : ''}${adj ? ' &mdash; not reachable' : ''}</span>` : ''}
          </div>
        </div>
        <div class="chev" id="${cid}">&#9660;</div>
      </div>
      <div class="action-body" id="${sid}">
        ${compatNote}
        ${reachNote}
        ${fv ? mavenSnippet(f.artifact || '', fv) : ''}
        ${cveHtml ? `<div style="margin-top:14px"><h4 class="sub">Vulnerability Details</h4>${cveHtml}</div>` : ''}
        ${rmHtml}
        ${bcHtml}
        ${stabHtml}
        ${rationaleHtml}
      </div>
    </div>`;
      }).join('');
    }

    function toggle(bodyId, chevId) {
      const b = document.getElementById(bodyId), c = document.getElementById(chevId);
      if (b) b.classList.toggle('open');
      if (c) c.classList.toggle('open');
    }

    // ─── Graph validation ──────────────────────────────────────────────────────
    if (gv) {
      const labels = {
        CLEAN: '&#10003; Clean &mdash; no new vulnerable transitive dependencies',
        HAS_RISKS: '&#9888; Risks detected &mdash; new vulnerable dependencies found',
        // Either the graph service could not be reached, or a fix version is
        // absent from it. Both leave the combined upgrade unvalidated.
        UNAVAILABLE: 'Not validated &mdash; fix versions absent from the ecosystem graph, or graph service unreachable',
        NOT_RUN: 'Not run',
      };
      let html = `<div class="gv-status ${gvSt}">${labels[gvSt] ?? esc(gvSt)}</div>`;
      if (gv.analyzedArtifacts?.length > 0)
        html += `<p style="font-size:12px;font-weight:600;color:#475569;margin:8px 0 4px">Fix versions validated:</p>
             <div class="deps-grid">${gv.analyzedArtifacts.map(a => `<div class="dep-item">${esc(a)}</div>`).join('')}</div>`;
      if (gv.newVulnerableDeps?.length > 0)
        html += `<p style="font-size:12px;font-weight:600;color:#991b1b;margin:12px 0 4px">New vulnerable transitive dependencies:</p>
             <div class="deps-grid">${gv.newVulnerableDeps.map(a => `<div class="dep-item" style="border-color:#fca5a5;color:#991b1b">${esc(a)}</div>`).join('')}</div>`;
      if (gvSt === 'CLEAN')
        html += `<div class="note ok" style="margin-top:12px"><strong>&#10003; Safe to apply all upgrades simultaneously</strong>Applying all recommended fixes does not introduce new vulnerable transitive dependencies.</div>`;
      document.getElementById('gv-body').innerHTML = html;
    }

    // ─── Scanned dependencies ──────────────────────────────────────────────────
    document.getElementById('deps-cnt').textContent = (data.totalDependenciesScanned ?? 0) + ' deps';
    const depArtifacts = Array.isArray(data.scannedArtifacts)
      ? data.scannedArtifacts
      : findings.map(f => f.artifact).filter(Boolean);
    document.getElementById('deps-grid').innerHTML = depArtifacts.length > 0
      ? depArtifacts.map(a => `<div class="dep-item">${esc(a)}</div>`).join('')
      : '<p style="color:#94a3b8;font-size:12px">Not available.</p>';
  </script>
</body>

</html>
